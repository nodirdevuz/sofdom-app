<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Joymee — Аренда квартир от собственников</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="https://joymee.uz/favicon/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* =======================================================
       CSS VARIABLES & THEME (NO GREEN COLORS!)
       ======================================================= */
    :root {
      --bg-page: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-muted: #f1f5f9;
      --bg-hover: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-sub: #94a3b8;
      --border-light: #e2e8f0;
      
      --brand-yellow: #facc15;
      --brand-yellow-hover: #eab308;
      --brand-dark: #0f172a;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      
      --max-width: 1440px;
    }

    [data-theme="dark"] {
      --bg-page: #0b0f17;
      --bg-surface: #131b2a;
      --bg-card: #162032;
      --bg-muted: #1e293b;
      --bg-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --border-light: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    button, .clickable {
      cursor: pointer;
      user-select: none;
    }

    /* HEADER */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 12px 24px;
      transition: background 0.2s ease;
    }

    .header-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: #000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: var(--brand-yellow);
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .header-center {
      flex: 1;
      max-width: 580px;
      position: relative;
    }
    .search-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 44px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-muted);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: #0f172a;
      background: var(--bg-surface);
    }
    [data-theme="dark"] .search-input:focus {
      border-color: #f8fafc;
    }
    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      pointer-events: none;
    }
    .search-clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-sub);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .search-clear-btn.active {
      display: flex;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      position: relative;
    }
    .action-icon-btn:hover {
      background: var(--bg-muted);
    }
    .badge-counter {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-create-ad {
      background: var(--brand-yellow);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: var(--radius-full);
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-create-ad:hover {
      background: var(--brand-yellow-hover);
    }

    .user-avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border-light);
      padding: 0;
      background: none;
    }
    .user-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TOOLBAR ROW */
    .toolbar-row {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 10px 24px;
    }
    .toolbar-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .view-switchers {
      display: flex;
      align-items: center;
      background: var(--bg-muted);
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 4px;
    }
    .view-btn {
      padding: 7px 12px;
      min-width: 38px;
      justify-content: center;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .view-btn.active {
      background: #000;
      color: #fff;
    }
    [data-theme="dark"] .view-btn.active {
      background: #fff;
      color: #000;
    }

    .pill-action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 700;
    }
    .pill-action-btn:hover {
      background: var(--bg-muted);
    }
    .pill-action-btn.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }
    [data-theme="dark"] .pill-action-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* SEGMENTED TABS */
    .segmented-tabs-wrapper {
      max-width: var(--max-width);
      margin: 16px auto 0;
      padding: 0 24px;
    }
    .segmented-tabs {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      padding: 4px;
      border-radius: var(--radius-full);
      gap: 4px;
      max-width: 420px;
    }
    .deal-tab {
      flex: 1;
      padding: 9px 18px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      transition: all 0.15s ease;
    }
    .deal-tab.active {
      background: var(--brand-yellow);
      color: #000;
      font-weight: 800;
    }

    /* QUICK CHIPS ROW */
    .quick-chips-wrapper {
      max-width: var(--max-width);
      margin: 14px auto 0;
      padding: 0 24px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-chips-wrapper::-webkit-scrollbar {
      display: none;
    }
    .quick-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: max-content;
    }
    .filter-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .filter-chip:hover {
      background: var(--bg-muted);
    }
    .filter-chip.chip-owner-active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      font-weight: 700;
    }
    [data-theme="dark"] .filter-chip.chip-owner-active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
    }
    .filter-chip.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    [data-theme="dark"] .filter-chip.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
    }

    /* VIP SECTION */
    .vip-section {
      max-width: var(--max-width);
      margin: 24px auto 0;
      padding: 0 24px;
    }
    .vip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .vip-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vip-carousel-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .carousel-nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vip-carousel {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc((100% - 64px) / 5);
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .vip-carousel::-webkit-scrollbar {
      display: none;
    }

    .vip-card {
      position: relative;
      height: 220px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      scroll-snap-align: start;
      cursor: pointer;
      background: var(--bg-muted);
    }
    .vip-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vip-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.85) 100%);
    }
    .vip-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--brand-yellow);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .vip-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      color: #fff;
    }
    .vip-price {
      font-size: 18px;
      font-weight: 800;
    }
    .vip-card-title {
      font-size: 12px;
      font-weight: 500;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.95);
    }

    /* MAIN SECTION */
    .main-section {
      max-width: var(--max-width);
      margin: 24px auto;
      padding: 0 24px;
      flex: 1;
      width: 100%;
    }

    .feed-header-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .feed-counts h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .feed-counts p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sort-select {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .content-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .content-layout.split-map-active {
      grid-template-columns: 1fr 480px;
    }

    /* =======================================================
       CARD & HORIZONTAL PHOTO GALLERY SCROLLING
       ======================================================= */
    .cards-container.mode-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card styling: No jumpy animations, clean surface */
    .avito-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: grid;
      grid-template-columns: 320px 1fr 220px;
      gap: 20px;
      cursor: pointer;
      position: relative;
    }

    /* Photo Gallery Container with horizontal scroll */
    .card-gallery-wrap {
      position: relative;
      width: 100%;
      height: 215px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-muted);
    }

    .card-gallery-scroll {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .card-gallery-scroll::-webkit-scrollbar {
      display: none;
    }

    .gallery-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
    }
    .gallery-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Gallery Arrow Buttons */
    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .card-gallery-wrap:hover .gallery-nav-btn {
      opacity: 1;
    }
    .gallery-nav-btn.prev {
      left: 8px;
    }
    .gallery-nav-btn.next {
      right: 8px;
    }

    .gallery-counter {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 3;
    }

    .card-owner-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #0f172a;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      z-index: 3;
    }
    [data-theme="dark"] .card-owner-badge {
      background: #ffffff;
      color: #0f172a;
    }

    .card-fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      z-index: 3;
    }
    .card-fav-btn.active {
      color: #ef4444;
      background: #fff;
    }

    /* Central Info Column */
    .avito-info-box {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .avito-title-line {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
    }

    .avito-metro-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .metro-walk-time {
      color: var(--text-muted);
      font-weight: 500;
    }

    .avito-address-line {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .avito-amenities-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .amenity-chip {
      background: var(--bg-muted);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .avito-desc-snippet {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .avito-footer-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* Action & Price Column */
    .avito-action-box {
      border-left: 1px solid var(--border-light);
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .avito-price-wrap {
      display: flex;
      flex-direction: column;
    }
    .avito-main-price {
      font-size: 23px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .avito-price-unit {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 3px;
    }
    .avito-deposit-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .btn-show-phone {
      width: 100%;
      height: 42px;
      background: var(--brand-yellow);
      border: none;
      border-radius: var(--radius-md);
      color: #000;
      font-weight: 800;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }
    .btn-show-phone:hover {
      background: var(--brand-yellow-hover);
    }

    /* GRID VIEW */
    .cards-container.mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cards-container.mode-grid .avito-card {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      gap: 0;
    }
    .cards-container.mode-grid .card-gallery-wrap {
      height: 200px;
      border-radius: 0;
    }
    .cards-container.mode-grid .avito-info-box {
      padding: 16px;
      flex: 1;
    }
    .cards-container.mode-grid .avito-action-box {
      border-left: none;
      border-top: 1px solid var(--border-light);
      padding: 14px 16px;
    }

    /* SIDE MAP */
    .map-sidebar-container {
      display: none;
      position: sticky;
      top: 88px;
      height: calc(100vh - 120px);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-light);
    }
    .content-layout.split-map-active .map-sidebar-container {
      display: block;
    }
    #leafletMap {
      width: 100%;
      height: 100%;
    }
    .map-price-pill {
      background: #000;
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      border: 2px solid var(--brand-yellow);
      white-space: nowrap;
    }

    /* FLOATING STATUS DOCK */
    .floating-widget-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-full);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      z-index: 999;
    }
    .dock-close-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      display: flex;
    }
    .dock-dots {
      letter-spacing: 2px;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    /* MOBILE BOTTOM TAB BAR */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-light);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
    }

    .mobile-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 600;
      text-decoration: none;
    }
    .mobile-tab-item.active {
      color: #000;
      font-weight: 800;
    }
    [data-theme="dark"] .mobile-tab-item.active {
      color: #fff;
    }
    .mobile-tab-center-icon {
      width: 36px;
      height: 36px;
      background: var(--brand-yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      margin-top: -10px;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-light);
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: var(--bg-muted);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }
    .modal-owner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }
    [data-theme="dark"] .modal-owner-badge {
      background: #fff;
      color: #0f172a;
    }
    .modal-phone-box {
      background: var(--bg-muted);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      margin: 16px 0;
    }
    .modal-phone-number {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
    }
    .btn-action-copy {
      width: 100%;
      background: var(--brand-yellow);
      color: #000;
      font-weight: 800;
      padding: 12px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 14px;
    }

    /* TOAST */
    .toast-msg {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #000;
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 13.5px;
      font-weight: 700;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* FOOTER */
    footer.site-footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-light);
      padding: 24px;
      margin-top: 40px;
    }
    .footer-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* =======================================================
       RESPONSIVE & IPHONE 16 PRO MAX (430px) OPTIMIZATION
       ======================================================= */
    @media (max-width: 1100px) {
      .avito-card {
        grid-template-columns: 280px 1fr 200px;
        gap: 16px;
      }
      .vip-carousel {
        grid-auto-columns: calc((100% - 32px) / 3);
      }
    }

    @media (max-width: 900px) {
      .avito-card {
        grid-template-columns: 1fr;
        padding: 14px;
        gap: 14px;
      }
      .card-gallery-wrap {
        height: 240px;
      }
      .gallery-nav-btn {
        opacity: 0.85;
      }
      .avito-action-box {
        border-left: none;
        border-top: 1px solid var(--border-light);
        padding-left: 0;
        padding-top: 14px;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .btn-show-phone {
        margin-top: 0;
        width: auto;
        padding: 0 24px;
        height: 40px;
      }
      .cards-container.mode-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .content-layout.split-map-active {
        grid-template-columns: 1fr;
      }
      .map-sidebar-container {
        display: none !important;
      }
      .vip-carousel {
        grid-auto-columns: calc((100% - 16px) / 2.2);
      }
    }

    @media (max-width: 640px) {
      header.site-header {
        padding: 10px 16px;
      }
      .header-right .btn-create-ad,
      .header-right .action-icon-btn.hide-on-mobile {
        display: none;
      }
      .toolbar-row, .segmented-tabs-wrapper, .quick-chips-wrapper, .vip-section, .main-section {
        padding-left: 14px;
        padding-right: 14px;
      }
      .segmented-tabs {
        max-width: 100%;
      }
      .vip-carousel {
        grid-auto-columns: 82%;
      }
      .avito-card {
        padding: 12px;
        gap: 12px;
      }
      .card-gallery-wrap {
        height: 220px;
      }
      .avito-action-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .btn-show-phone {
        width: 100%;
        height: 44px;
      }
      .mobile-bottom-bar {
        display: grid;
      }
      footer.site-footer {
        padding-bottom: 84px;
      }
      .floating-widget-dock {
        bottom: 74px;
      }
    }
  </style>
</head>

kva-reutovskaya-ulica-2944566029-1.jpg", "https://images.cdn-cian.ru/images/kvartira-moskva-reutovskaya-ulica-2944566044-1.jpg", "https://images.cdn-cian.ru/images/kvartira-moskva-reutovskaya-ulica-2944566032-1.jpg"], "photos_count": 5, "phone": "+7 (985) 264-10-16", "saving_text": "0% комиссии риелтору", "saving_amount": "Экономия: 50 000 ₽", "is_owner": true, "is_new": true, "is_top": false, "time_ago": "4 ч. назад", "lat": 55.735961, "lng": 37.837534}];

    let currentDealType = 'Длительная аренда';
    let onlyOwners = true;
    let selectedRoom = null;
    let onlyNoDeposit = false;
    let favorites = new Set();
    let currentSearch = '';
    let mapInstance = null;
    let markersLayer = null;
    let isMapOpen = false;

    document.addEventListener('DOMContentLoaded', () => {
      renderVipCarousel();
      renderOffers();
      setupSearch();
      initTheme();
    });

    function initTheme() {
      const saved = localStorage.getItem('joymee_theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcons(saved);
    }
    function toggleTheme() {
      const curr = document.documentElement.getAttribute('data-theme') || 'light';
      const next = curr === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('joymee_theme', next);
      updateThemeIcons(next);
      showToast(next === 'dark' ? 'Тёмная тема' : 'Светлая тема');
    }
    function updateThemeIcons(theme) {
      document.getElementById('themeIconMoon').style.display = theme === 'dark' ? 'none' : 'block';
      document.getElementById('themeIconSun').style.display = theme === 'dark' ? 'block' : 'none';
    }

    let currentLang = 'RU';
    function toggleLang() {
      currentLang = currentLang === 'RU' ? 'UZ' : (currentLang === 'UZ' ? 'EN' : 'RU');
      document.getElementById('langLabel').textContent = currentLang;
      showToast('Язык: ' + currentLang);
    }

    function renderVipCarousel() {
      const container = document.getElementById('vipCarousel');
      container.innerHTML = VIP_ITEMS.map(item => `
        <div class="vip-card clickable" onclick="openContactModal('${item.id}', '${item.title.replace(/'/g, "\'")}', '${item.metro}', '${item.phone}')">
          <img src="${item.photo}" alt="${item.title}" loading="lazy">
          <div class="vip-gradient-overlay"></div>
          <div class="vip-badge">
            <span>VIP</span>
          </div>
          <div class="vip-content">
            <div class="vip-price">${item.price}</div>
            <div class="vip-card-title">${item.title}</div>
          </div>
        </div>
      `).join('');
    }

    function scrollVip(direction) {
      const container = document.getElementById('vipCarousel');
      const card = container.querySelector('.vip-card');
      const cardWidth = card ? card.offsetWidth + 16 : 240;
      container.scrollBy({ left: direction * cardWidth * 2, behavior: 'smooth' });
    }

    /* IN-CARD PHOTO GALLERY SLIDER */
    function slideGallery(id, direction) {
      const scrollEl = document.getElementById('gal-' + id);
      if (!scrollEl) return;
      const slideWidth = scrollEl.offsetWidth;
      scrollEl.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
    }

    function updateGalleryDots(id, total) {
      const scrollEl = document.getElementById('gal-' + id);
      const countEl = document.getElementById('count-' + id);
      if (!scrollEl || !countEl) return;
      const current = Math.round(scrollEl.scrollLeft / scrollEl.offsetWidth) + 1;
      countEl.textContent = `${current} / ${total}`;
    }

    /* RENDER OFFERS */
    function renderOffers() {
      const container = document.getElementById('cardsGrid');
      
      let filtered = OFFERS.filter(item => {
        if (item.deal_type !== currentDealType) return false;
        if (onlyOwners && !item.is_owner) return false;
        if (selectedRoom && !item.rooms.includes(selectedRoom)) return false;
        if (onlyNoDeposit && !item.deposit.toLowerCase().includes('без залога')) return false;
        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          const match = (item.title && item.title.toLowerCase().includes(q)) ||
                        (item.metro_name && item.metro_name.toLowerCase().includes(q)) ||
                        (item.address && item.address.toLowerCase().includes(q)) ||
                        (item.price_display && item.price_display.toLowerCase().includes(q));
          if (!match) return false;
        }
        return true;
      });

      document.getElementById('foundCount').textContent = `Найдено: ${filtered.length} вариантов`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
            <div style="font-size: 40px; margin-bottom: 12px;">🏠</div>
            <h3 style="font-size: 19px; font-weight: 800;">Объявлений по данным фильтрам не найдено</h3>
            <p style="color: var(--text-muted); margin-top: 6px;">Попробуйте выбрать другой тип комнат или очистить поиск</p>
            <button class="btn-create-ad clickable" style="margin: 20px auto 0;" onclick="clearSearch(); resetRoomFilters();">
              Показать все
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isFav = favorites.has(item.id);
        const cleanTitle = (item.title || 'Квартира от собственника').replace(/'/g, "\'");
        const cleanAddr = (item.address || '').replace(/'/g, "\'");
        const totalPhotos = item.photos.length;
        
        return `
          <article class="avito-card" id="card-${item.id}" onclick="openContactModal('${item.id}', '${cleanTitle}', '${cleanAddr}', '${item.phone}')">
            
            <!-- 1. HORIZONTAL PHOTO GALLERY -->
            <div class="card-gallery-wrap" onclick="event.stopPropagation()">
              <div class="card-gallery-scroll" id="gal-${item.id}" onscroll="updateGalleryDots('${item.id}', ${totalPhotos})">
                ${item.photos.map(p => `
                  <div class="gallery-slide">
                    <img src="${p}" alt="Фото" loading="lazy">
                  </div>
                `).join('')}
              </div>

              ${totalPhotos > 1 ? `
                <button class="gallery-nav-btn prev" onclick="slideGallery('${item.id}', -1)">‹</button>
                <button class="gallery-nav-btn next" onclick="slideGallery('${item.id}', 1)">›</button>
                <div class="gallery-counter" id="count-${item.id}">1 / ${totalPhotos}</div>
              ` : ''}

              <div class="card-owner-badge">СОБСТВЕННИК</div>

              <button class="card-fav-btn clickable ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${item.id}', this)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
              </button>
            </div>

            <!-- 2. CENTRAL INFO -->
            <div class="avito-info-box">
              <div>
                <h3 class="avito-title-line">${item.title}</h3>
                
                <div class="avito-metro-line">
                  <span>${item.metro_name}</span>
                  <span class="metro-walk-time">• ${item.metro_walk}</span>
                </div>

                <div class="avito-address-line">${item.address}</div>

                <div class="avito-amenities-row">
                  ${item.amenities.map(a => `<span class="amenity-chip">${a}</span>`).join('')}
                </div>

                <div class="avito-desc-snippet">${item.desc_short}</div>
              </div>

              <div class="avito-footer-meta">
                <span>Прямой хозяин</span>
                <span>•</span>
                <span>${item.time_ago}</span>
              </div>
            </div>

            <!-- 3. PRICE & PHONE -->
            <div class="avito-action-box">
              <div class="avito-price-wrap">
                <div>
                  <span class="avito-main-price">${item.price_display}</span>
                  <span class="avito-price-unit">${item.price_unit}</span>
                </div>
                <div class="avito-deposit-text">${item.deposit}</div>
              </div>

              <div>
                <button class="btn-show-phone clickable">
                  <span>Показать телефон</span>
                </button>
              </div>
            </div>

          </article>
        `;
      }).join('');

      updateMapMarkers(filtered);
    }

    function setViewMode(mode) {
      const container = document.getElementById('cardsGrid');
      const gridBtn = document.getElementById('viewGridBtn');
      const listBtn = document.getElementById('viewListBtn');

      if (mode === 'grid') {
        container.classList.remove('mode-list');
        container.classList.add('mode-grid');
        gridBtn.classList.add('active');
        listBtn.classList.remove('active');
      } else {
        container.classList.remove('mode-grid');
        container.classList.add('mode-list');
        listBtn.classList.add('active');
        gridBtn.classList.remove('active');
      }
    }

    function setDealType(type, btn) {
      currentDealType = type;
      if (btn) {
        document.querySelectorAll('.deal-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      renderOffers();
    }

    function toggleOwnerFilter() {
      onlyOwners = !onlyOwners;
      const btn = document.getElementById('chipOwnerBtn');
      btn.classList.toggle('chip-owner-active', onlyOwners);
      renderOffers();
    }

    function filterByRooms(room, btn) {
      if (selectedRoom === room) {
        selectedRoom = null;
        btn.classList.remove('active');
      } else {
        document.querySelectorAll('.filter-chip').forEach(b => {
          if (b.textContent.includes('комн') || b.textContent.includes('Студи')) b.classList.remove('active');
        });
        selectedRoom = room;
        btn.classList.add('active');
      }
      renderOffers();
    }

    function filterNoDeposit(btn) {
      onlyNoDeposit = !onlyNoDeposit;
      btn.classList.toggle('active', onlyNoDeposit);
      renderOffers();
    }

    function resetRoomFilters() {
      selectedRoom = null;
      onlyNoDeposit = false;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      document.getElementById('chipOwnerBtn').classList.add('chip-owner-active');
      renderOffers();
    }

    function toggleMapSplit() {
      const layout = document.getElementById('contentLayout');
      const btn = document.getElementById('mapToggleBtn');
      isMapOpen = !isMapOpen;

      if (isMapOpen) {
        layout.classList.add('split-map-active');
        btn.classList.add('active');
        btn.querySelector('span').textContent = 'Скрыть карту';
        initLeaflet();
      } else {
        layout.classList.remove('split-map-active');
        btn.classList.remove('active');
        btn.querySelector('span').textContent = 'Смотреть на карте';
      }
    }

    function initLeaflet() {
      if (mapInstance) {
        mapInstance.invalidateSize();
        return;
      }
      mapInstance = L.map('leafletMap').setView([55.751244, 37.618423], 11);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapInstance);
      markersLayer = L.layerGroup().addTo(mapInstance);
      updateMapMarkers(OFFERS);
    }

    function updateMapMarkers(offersList) {
      if (!mapInstance || !markersLayer) return;
      markersLayer.clearLayers();
      offersList.forEach(item => {
        if (!item.lat || !item.lng) return;
        const icon = L.divIcon({
          className: 'custom-map-pin',
          html: `<div class="map-price-pill">${item.price_display}</div>`,
          iconSize: [80, 24],
          iconAnchor: [40, 12]
        });
        const marker = L.marker([item.lat, item.lng], { icon }).addTo(markersLayer);
        marker.on('click', () => {
          const card = document.getElementById(`card-${item.id}`);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      });
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('searchClearBtn');
      if (!input) return;
      input.addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        if (clearBtn) clearBtn.classList.toggle('active', currentSearch.length > 0);
        renderOffers();
      });
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      currentSearch = '';
      document.getElementById('searchClearBtn').classList.remove('active');
      renderOffers();
    }

    function toggleFavorite(id, btn) {
      if (favorites.has(id)) {
        favorites.delete(id);
        btn.classList.remove('active');
        btn.querySelector('svg').setAttribute('fill', 'none');
        showToast('Удалено из избранного');
      } else {
        favorites.add(id);
        btn.classList.add('active');
        btn.querySelector('svg').setAttribute('fill', 'currentColor');
        showToast('Добавлено в избранное');
      }
      const badge = document.getElementById('favCountBadge');
      if (favorites.size > 0) {
        badge.style.display = 'flex';
        badge.textContent = favorites.size;
      } else {
        badge.style.display = 'none';
      }
    }

    function toggleFavFilter() {
      if (favorites.size === 0) {
        showToast('Нет сохраненных объектов');
        return;
      }
      showToast(`Избранное: ${favorites.size}`);
    }

    let currentModalPhone = '';
    function openContactModal(id, title, address, phone) {
      currentModalPhone = phone;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalAddress').textContent = address;
      document.getElementById('modalPhone').textContent = phone;
      document.getElementById('contactModal').classList.add('active');
    }
    function closeContactModal() {
      document.getElementById('contactModal').classList.remove('active');
    }
    function copyModalPhone() {
      navigator.clipboard.writeText(currentModalPhone).then(() => {
        showToast('Номер скопирован');
      }).catch(() => {
        showToast(currentModalPhone);
      });
    }

    function openFilterModal() {
      document.getElementById('filterModal').classList.add('active');
    }
    function closeFilterModal() {
      document.getElementById('filterModal').classList.remove('active');
    }
    function openNewAdModal() {
      showToast('Размещение объявления');
    }

    function handleSort(val) {
      if (val === 'price_asc') {
        OFFERS.sort((a,b) => (a.price_val || 0) - (b.price_val || 0));
      } else if (val === 'price_desc') {
        OFFERS.sort((a,b) => (b.price_val || 0) - (a.price_val || 0));
      } else {
        OFFERS.sort((a,b) => (b.is_top ? 1 : 0) - (a.is_top ? 1 : 0));
      }
      renderOffers();
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
